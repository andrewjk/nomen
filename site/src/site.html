<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			// Apply the stored theme before first paint: dark is the default; a
			// stored "light" — or the OS preference, when nothing is stored —
			// wins. The nav's toggle flips this class and persists the choice.
			(() => {
				const stored = localStorage.getItem("theme");
				if (
					stored ? stored === "light" : matchMedia("(prefers-color-scheme: light)").matches
				) {
					document.documentElement.classList.add("light");
				}
			})();
		</script>
		<link rel="icon" type="image/svg+xml" href="/src/assets/nomen.svg" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#101214" />
		<link rel="stylesheet" href="/src/assets/style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nomen</title>
	</head>
	<body>
		<div id="app" style="display: contents">
			<!-- Route components will be rendered here -->
		</div>
	</body>
</html>
